<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/peerllm.css' | relative_url }}">
    <link rel="icon" href="https://www.peerllm.com/src/assets/peerllm-logo-transparent.png">
  </head>

  <body>
    <header>
      <a href="https://www.peerllm.com">
        <img src="https://www.peerllm.com/src/assets/peerllm-logo-transparent.png" alt="PeerLLM Logo" />
      </a>
      <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="https://www.peerllm.com">Main Site</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>© 2025 Hassan Habib · Decentralized Intelligence for Everyone</p>
    </footer>

    <script>
      // External links open in a new tab; the blog stays where it is.
      for (const link of document.querySelectorAll('a[href]')) {
        if (link.origin !== window.location.origin) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
      }
    </script>
  </body>
</html>
