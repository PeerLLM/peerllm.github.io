<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1260" width="2400" height="1260" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive">
  <defs>
    <!-- hand-drawn wobble for all strokes -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#ececec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="cloud" viewBox="0 0 240 140">
      <path d="M40,108 C16,108 10,84 32,76 C24,50 60,42 76,60 C86,36 134,36 146,62 C158,42 196,50 192,80 C214,84 212,112 188,112 C188,112 60,112 40,108 Z"
            fill="none" stroke="#ececec" stroke-width="2.1" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="2400" height="1260" fill="#0c0f16"/>

  <!-- ===== strokes (hand-drawn) ===== -->
  <g filter="url(#rough)" fill="none" stroke="#ececec" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- BEFORE: the first-generation engine -->
    <rect x="140" y="330" width="920" height="640" rx="22"/>
    <rect x="200" y="440" width="220" height="84" rx="14"/>   <!-- DECIDE -->
    <rect x="780" y="440" width="220" height="84" rx="14"/>   <!-- VALIDATE -->
    <rect x="200" y="620" width="220" height="84" rx="14"/>   <!-- RETRY -->
    <rect x="780" y="620" width="220" height="84" rx="14"/>   <!-- REVIEW -->
    <rect x="200" y="800" width="220" height="84" rx="14"/>   <!-- TRANSCRIPT -->
    <rect x="780" y="800" width="220" height="84" rx="14"/>   <!-- FALLBACK -->
    <rect x="490" y="620" width="220" height="84" rx="14"/>   <!-- TOOLS -->

    <!-- every concern wired to every other -->
    <path d="M420,482 L768,482" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M310,524 L310,608" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M890,524 L890,608" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M310,704 L310,788" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M890,704 L890,788" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M420,510 L784,628" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M780,510 L424,628" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M420,840 L768,840" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M424,700 L784,824" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M420,662 L478,662" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M710,662 L768,662" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

    <!-- graduated -->
    <path d="M1110,650 L1265,650" marker-end="url(#arrow)" stroke-width="3.4"/>

    <!-- AFTER: on The Standard Agent -->
    <rect x="1320" y="330" width="700" height="640" rx="22"/>
    <rect x="1370" y="440" width="300" height="470" rx="16"/> <!-- THE STANDARD AGENT -->
    <rect x="1410" y="530" width="220" height="70" rx="12"/>  <!-- THE LOOP -->
    <rect x="1410" y="625" width="220" height="70" rx="12"/>  <!-- PERIMETER -->
    <rect x="1410" y="720" width="220" height="70" rx="12"/>  <!-- BUDGETS -->
    <rect x="1410" y="815" width="220" height="70" rx="12"/>  <!-- REVIEW -->
    <rect x="1730" y="580" width="240" height="150" rx="16"/> <!-- ROUTING BRAIN -->
    <path d="M1670,655 L1718,655" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

    <use href="#cloud" x="2030" y="340" width="360" height="260"/>  <!-- COMMUNITY HOSTS -->
    <rect x="2080" y="780" width="280" height="140" rx="18"/>       <!-- PeerLLM CORE -->
    <path d="M1972,600 L2054,540" marker-end="url(#arrow)"/>
    <path d="M1974,700 L2080,810" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== text (crisp) ===== -->
  <g fill="#f1f1f1" text-anchor="middle">
    <text x="1200" y="130" font-size="54" letter-spacing="8" fill="#fafafa">LLooMA 2.0  ON  THE  STANDARD  AGENT</text>

    <text x="600" y="250" font-size="40">BEFORE</text>
    <text x="600" y="292" font-size="23" fill="#9fb4d4">one engine · carried alone</text>

    <text x="1840" y="250" font-size="40">AFTER</text>
    <text x="1840" y="292" font-size="23" fill="#9fb4d4">the loop inherited · the routing ours</text>

    <text x="600" y="400" font-size="26">ORCHESTRATOR</text>

    <text x="310" y="492" font-size="21">DECIDE</text>
    <text x="890" y="492" font-size="21">VALIDATE</text>
    <text x="310" y="672" font-size="21">RETRY</text>
    <text x="890" y="672" font-size="21">REVIEW</text>
    <text x="310" y="852" font-size="21">TRANSCRIPT</text>
    <text x="890" y="852" font-size="21">FALLBACK</text>
    <text x="600" y="672" font-size="21">TOOLS</text>

    <text x="1188" y="615" font-size="24" fill="#aeb7c5">graduated</text>

    <text x="1670" y="400" font-size="26">ORCHESTRATOR</text>

    <text x="1520" y="490" font-size="21">THE STANDARD AGENT</text>
    <text x="1520" y="575" font-size="20">THE LOOP</text>
    <text x="1520" y="670" font-size="20">PERIMETER</text>
    <text x="1520" y="765" font-size="20">BUDGETS</text>
    <text x="1520" y="860" font-size="20">REVIEW</text>

    <text x="1850" y="645" font-size="21">ROUTING</text>
    <text x="1850" y="675" font-size="21">BRAIN</text>
    <text x="1850" y="705" font-size="17" fill="#9fb4d4">network-first</text>

    <text x="2210" y="480" font-size="21">COMMUNITY</text>
    <text x="2210" y="510" font-size="21">HOSTS</text>
    <text x="2220" y="855" font-size="21">PeerLLM CORE</text>

    <text x="1990" y="560" font-size="17" fill="#aeb7c5">first</text>
    <text x="1962" y="750" font-size="17" fill="#aeb7c5">on any miss</text>
  </g>

  <!-- footer principles -->
  <text x="1200" y="1180" font-size="26" text-anchor="middle" fill="#7f8a9c"
        font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive">
    the loop is inherited  ·  the routing is ours  ·  one interface between them
  </text>
</svg>
