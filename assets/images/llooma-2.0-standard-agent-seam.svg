<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1150" width="2000" height="1150" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive">
  <defs>
    <!-- hand-drawn wobble for all strokes -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#ececec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="cloud" viewBox="0 0 240 140">
      <path d="M40,108 C16,108 10,84 32,76 C24,50 60,42 76,60 C86,36 134,36 146,62 C158,42 196,50 192,80 C214,84 212,112 188,112 C188,112 60,112 40,108 Z"
            fill="none" stroke="#ececec" stroke-width="2.1" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="2000" height="1150" fill="#0c0f16"/>

  <!-- ===== strokes (hand-drawn) ===== -->
  <g filter="url(#rough)" fill="none" stroke="#ececec" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- YOU -->
    <use href="#cloud" x="60" y="480" width="320" height="190"/>

    <!-- ORCHESTRATOR (outer, now thin) -->
    <rect x="470" y="180" width="920" height="800" rx="22"/>

    <!-- THE STANDARD AGENT (inherited) -->
    <rect x="530" y="310" width="440" height="620" rx="18"/>
    <rect x="570" y="420" width="360" height="90" rx="14"/>   <!-- THE LOOP -->
    <rect x="570" y="540" width="360" height="90" rx="14"/>   <!-- PERIMETER -->
    <rect x="570" y="660" width="360" height="90" rx="14"/>   <!-- BUDGETS -->
    <rect x="570" y="780" width="360" height="90" rx="14"/>   <!-- REVIEW -->

    <!-- ROUTING BRAIN (ours) -->
    <rect x="1050" y="510" width="290" height="190" rx="18"/>

    <!-- the one interface -->
    <path d="M970,605 L1038,605" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

    <!-- brain -> network -->
    <use href="#cloud" x="1510" y="210" width="420" height="310"/>   <!-- COMMUNITY HOSTS -->
    <rect x="1540" y="750" width="360" height="180" rx="22"/>        <!-- PeerLLM CORE -->
    <path d="M1342,545 L1540,430" marker-end="url(#arrow)"/>
    <path d="M1344,670 L1532,800" marker-end="url(#arrow)"/>

    <!-- you -> orchestrator -->
    <path d="M380,575 L458,575" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== text (crisp) ===== -->
  <g fill="#f1f1f1" text-anchor="middle">
    <text x="1000" y="110" font-size="48" letter-spacing="6" fill="#fafafa">REBUILT  ON  THE  STANDARD  AGENT</text>

    <text x="220" y="578" font-size="30">YOU</text>
    <text x="220" y="612" font-size="20" fill="#9fb4d4">agent client</text>

    <text x="930" y="250" font-size="29">ORCHESTRATOR</text>
    <text x="930" y="284" font-size="19" fill="#9fb4d4">now a thin coordinator</text>

    <text x="750" y="368" font-size="26">THE STANDARD AGENT</text>
    <text x="750" y="398" font-size="18" fill="#9fb4d4">inherited, spec'd, conformance-tested</text>
    <text x="750" y="475" font-size="22">THE LOOP</text>
    <text x="750" y="595" font-size="22">PERIMETER</text>
    <text x="750" y="715" font-size="22">BUDGETS</text>
    <text x="750" y="835" font-size="22">REVIEW</text>

    <text x="1195" y="585" font-size="25">ROUTING</text>
    <text x="1195" y="620" font-size="25">BRAIN</text>
    <text x="1195" y="654" font-size="18" fill="#9fb4d4">ours · network-first</text>

    <text x="1720" y="387" font-size="27">COMMUNITY</text>
    <text x="1720" y="421" font-size="27">HOSTS</text>

    <text x="1720" y="835" font-size="29">PeerLLM CORE</text>
    <text x="1720" y="869" font-size="19" fill="#9fb4d4">fallback decider</text>

    <!-- edge labels -->
    <text x="420" y="550" font-size="18" fill="#aeb7c5">prompt</text>
    <text x="1004" y="580" font-size="17" fill="#aeb7c5">one</text>
    <text x="1004" y="662" font-size="17" fill="#aeb7c5">seam</text>
    <text x="1420" y="460" font-size="18" fill="#aeb7c5">first</text>
    <text x="1418" y="768" font-size="18" fill="#aeb7c5">on any miss</text>
  </g>

  <!-- footer principles -->
  <text x="1000" y="1085" font-size="23" text-anchor="middle" fill="#7f8a9c"
        font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive">
    the loop is inherited  ·  the routing is ours  ·  one interface between them
  </text>
</svg>
